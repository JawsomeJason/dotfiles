name: forbidden words

on:
  push:
  pull_request:

jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - name: Check files, history and tags
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          # Every employer has its own FORBIDDEN_WORDS* secret; check against all of them
          FORBIDDEN_WORDS=$(jq -r 'to_entries[] | select(.key | startswith("FORBIDDEN_WORDS")) | .value' <<<"$SECRETS_JSON" | paste -sd, -)
          export FORBIDDEN_WORDS
          scripts/check-words.sh --require-words --tree --history
